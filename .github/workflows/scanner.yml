name: BTC Futures 4H Scanner

on:
  workflow_dispatch: # Dipicu via API oleh cron-job.org atau manual dari web GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Klines & RF Data
        uses: actions/cache@v4
        with:
          path: data/
          key: scanner-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py --notify
