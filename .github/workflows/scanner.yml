name: BTC Futures 4H Scanner

on:
  schedule:
    # Runs at minute 5 after every 4H candle close in UTC:
    # 00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC
    # (Di WIB: 07:05, 11:05, 15:05, 19:05, 23:05, 03:05 WIB)
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Memungkinkan jalankan manual kapan saja dari web GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Klines & RF Data
        uses: actions/cache@v4
        with:
          path: data/
          key: scanner-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scanner-data-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py --notify
